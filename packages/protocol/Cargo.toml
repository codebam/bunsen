[package]
name = "bunsen-protocol"
version = "0.1.0"
edition = "2021"
description = "The Bunsen shell/renderer wire protocol, shared by every backend"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codebam/bunsen"

[dependencies]
async-channel = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
