[package]
name = "bunsen-render-blitz"
version = "0.1.0"
edition = "2021"
description = "Bunsen render backend: Blitz (Stylo + Taffy + Parley + Vello) behind the bunsen_render ABI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codebam/bunsen"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bunsen-protocol = { path = "../protocol" }

blitz-dom = "0.3.0-beta.1"
blitz-html = "0.3.0-beta.1"
# A vendored blitz-net: identical but for a user agent we can set. Upstream
# pins a 2020 Firefox string and appends it after caller headers, so it cannot
# be overridden from outside the crate — see that file's comment.
# `cookies` keeps a session alive across requests, which is the difference
# between a renderer and a browser: without it nothing stays logged in.
blitz-net = { package = "blitz-net-bunsen", path = "../blitz-net-bunsen" }
blitz-shell = "0.3.0-beta.1"
blitz-traits = "0.3.0-beta.1"
anyrender_vello = "0.12"
winit = "=0.31.0-beta.2"
winit-wayland = "=0.31.0-beta.2"

async-channel = "2"
libc = "0.2"

# blitz-dom depends on `image` with default-features = false, which compiles
# in no decoders at all — every <img> fetched fine and then painted nothing.
# Cargo features are additive across the graph, so enabling the formats here
# turns them on for blitz-dom's decode path. These are the formats the web
# actually serves.
image = { version = "=0.25.6", default-features = false, features = [
  "png", "jpeg", "gif", "webp", "bmp", "ico", "tiff",
] }
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "bunsen-render-blitz-host"
path = "src/bin/host.rs"
