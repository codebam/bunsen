[package]
name = "bunsen-render-webkit"
version = "0.1.0"
edition = "2021"
description = "Bunsen render backend: WebKitGTK behind the bunsen_render ABI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codebam/bunsen"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bunsen-protocol = { path = "../protocol" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
webkit6 = "0.4"
glib = "0.20"
async-channel = "2"
serde_json = "1"

[[bin]]
name = "bunsen-render-host"
path = "src/bin/host.rs"
