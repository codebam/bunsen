[package]
name = "bunsen-render-webkit"
version = "0.1.0"
edition = "2021"
description = "Phase-0 Bunsen render backend: WebKitGTK behind the bunsen_render ABI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codebam/bunsen"

[lib]
crate-type = ["cdylib"]

[dependencies]
gtk = { package = "gtk4", version = "0.9" }
webkit6 = "0.4"
glib = "0.20"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = true
